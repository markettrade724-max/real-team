<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a14;
      color: #e2e2e2;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loader {
      position: fixed;
      inset: 0;
      background: #0a0a14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #1a1a2e;
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #888; font-size: 14px; }
    #error-msg {
      display: none;
      text-align: center;
      padding: 24px;
    }
    #error-msg h2 { color: #ff4444; margin-bottom: 12px; }
    #error-msg a {
      color: #00ff88;
      text-decoration: none;
      border: 1px solid #00ff88;
      padding: 8px 20px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p>جاري تحميل اللعبة...</p>
</div>

<div id="error-msg">
  <h2>تعذّر تحميل اللعبة</h2>
  <p>تأكد من اتصالك بالإنترنت وأعد المحاولة.</p>
  <a href="/">العودة للرئيسية</a>
</div>

<div id="game-container">
  <iframe id="game-frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const slug   = params.get('game') || params.get('slug');
  const frame  = document.getElementById('game-frame');
  const loader = document.getElementById('loader');
  const errMsg = document.getElementById('error-msg');

  if (!slug) {
    loader.classList.add('hidden');
    errMsg.style.display = 'block';
  } else {
    // ضبط العنوان
    document.title = slug.replace(/-/g, ' ');

    // مسار اللعبة في public/games/{slug}/index.html
    frame.src = `/games/${slug}/index.html`;

    frame.onload = () => {
      setTimeout(() => loader.classList.add('hidden'), 500);
    };

    frame.onerror = () => {
      loader.classList.add('hidden');
      errMsg.style.display = 'block';
    };

    // timeout بعد 30 ثانية
    setTimeout(() => {
      if (!loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        errMsg.style.display = 'block';
      }
    }, 30000);
  }
</script>

</body>
</html>
