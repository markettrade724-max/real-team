name: Produce Episode

on:
  schedule:
    - cron: '0 18 */3 * *'   # كل 3 أيام الساعة 18:00 UTC
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'رقم الحلقة (فارغ = التالية تلقائياً)'
        required: false
        default: ''

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python + edge-tts
        run: |
          pip install edge-tts

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg static (backup)
        run: |
          ffmpeg -version || (
            wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar xf ffmpeg-release-amd64-static.tar.xz
            sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          )

      - name: Produce Episode
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID:       ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:   ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:   ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN:     ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_USERNAME:         ${{ secrets.TIKTOK_USERNAME }}
          MODE:                    episode
          EPISODE_NUMBER:          ${{ github.event.inputs.episode_number }}
        run: node orchestrator.js

      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_number }}
          path: |
            episodes/
            agent-results/episode-manifest.json
            agent-results/run-report.json
          retention-days: 30

      - name: Commit series progress
        run: |
          git config user.name  "Universe Bot"
          git config user.email "bot@universe.ai"
          git add series.json agent-results/run-report.json || true
          git diff --staged --quiet || git commit -m "episode: produced ep$(node -e "const s=require('./series.json'); console.log(s.nextEpisode-1)")"
          git push || true
