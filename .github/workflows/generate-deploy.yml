name: Generate Games & Deploy

on:
  push:
    paths:
      - 'game-generator.js'
      - 'templates/**'
      - 'products.json'
      - 'public/games/godot/**'
  workflow_dispatch:

jobs:
  generate-deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate game pages
        shell: bash
        run: node game-generator.js

      - name: Check results
        shell: bash
        run: |
          echo "Run Report:"
          cat agent-results/run-report.json 2>/dev/null || echo "(no report)"
          echo ""
          echo "Universe Status:"
          python3 -c '
import json
try:
    with open("universe.json") as f:
        u = json.load(f)
    print("  ID:         " + str(u.get("id", "")))
    print("  Evolutions: " + str(u.get("evolutions", 0)))
    print("  Worlds:     " + str(len(u.get("worlds", []))))
    print("  Weapons:    " + str(len(u.get("weapons", []))))
    print("  Enemies:    " + str(len(u.get("enemies", []))))
    print("  Vehicles:   " + str(len(u.get("vehicles", []))))
    print("  Born:       " + str(u.get("born", "")))
    print("  Last:       " + str(u.get("lastEvolved", "never")))
except Exception as e:
    print("  (no universe yet: " + str(e) + ")")
'

      - name: Trigger Godot Export (BIRTH only)
        if: ${{ github.event.inputs.mode == 'birth' }}
        shell: bash
        run: |
          echo "BIRTH MODE — triggering Godot export..."
          python3 -c '
import json, os
try:
    with open("universe.json") as f:
        u = json.load(f)
    if "GITHUB_ENV" in os.environ:
        with open(os.environ["GITHUB_ENV"], "a") as env_file:
            env_file.write("GODOT_SLUG=" + str(u.get("id", "")) + "\n")
except Exception as e:
    print("Error setting env: " + str(e))
'

      - name: Commit changes
        shell: bash
        run: |
          git config user.name  "universe-bot[bot]"
          git config user.email "universe-bot[bot]@users.noreply.github.com"

          git add universe.json          2>/dev/null || true
          git add products.json          2>/dev/null || true
          git add agent-results/         2>/dev/null || true
          git add godot-projects/        2>/dev/null || true
          git add public/                2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python3 -c '
import json
try:
    with open("agent-results/run-report.json") as f:
        r = json.load(f)
    with open("universe.json") as f:
        u = json.load(f)
    mode = "'"$MODE"'"
    evo  = u.get("evolutions", 0)
    if mode == "birth":
        msg = "BIRTH: Universe \"" + str(u.get("id", "")) + "\" created"
    else:
        agents = list(r.get("agents", {}).keys())
        if   "world"   in str(agents): kind = "New world"
        elif "weapon"  in str(agents): kind = "New weapon"
        elif "enemy"   in str(agents): kind = "New enemy"
        elif "vehicle" in str(agents): kind = "New vehicle"
        else: kind = "Evolution"
        msg = kind + " added — Evolution #" + str(evo) + " [skip ci]"
    print(msg)
except Exception as e:
    print("Universe evolution [skip ci]")
' > commit_msg.txt

          git commit -m "$(cat commit_msg.txt)"
          rm commit_msg.txt
          git pull --rebase origin main || git rebase --abort
          git push origin main --force-with-lease
          echo "Committed successfully"
