name: Universe Evolution

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - birth

jobs:
  evolve:
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Orchestrator
        shell: bash
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL:                  ${{ secrets.SITE_URL }}
          MODE:                      ${{ github.event.inputs.mode || 'auto' }}
        run: node orchestrator.js

      - name: Check results
        shell: bash
        run: |
          echo "Run Report:"
          cat agent-results/run-report.json 2>/dev/null || echo "(no report)"
          echo ""
          echo "Universe Status:"
          # ✅ إصلاح: python-3.14.5-amd64 بدل python
          python-3.14.5-amd64 -c "
import json
try:
    u = json.load(open('universe.json'))
    print('  ID:         ' + str(u.get('id', '')))
    print('  Evolutions: ' + str(u.get('evolutions', 0)))
    print('  Worlds:     ' + str(len(u.get('worlds', []))))
    print('  Weapons:    ' + str(len(u.get('weapons', []))))
    print('  Enemies:    ' + str(len(u.get('enemies', []))))
    print('  Vehicles:   ' + str(len(u.get('vehicles', []))))
    print('  Born:       ' + str(u.get('born', '')))
    print('  Last:       ' + str(u.get('lastEvolved', 'never')))
except Exception as e:
    print('  (no universe yet: ' + str(e) + ')')
" 2>/dev/null || echo "(python3 not available)"

      - name: Trigger Godot Export (BIRTH only)
        if: ${{ github.event.inputs.mode == 'birth' }}
        shell: bash
        run: |
          # ✅ إصلاح: python-3.14.5-amd64 بدل python
          SLUG=$(python-3.14.5-amd64 -c "
import json
try:
    u = json.load(open('universe.json'))
    slug = u.get('id', '').lower().replace(' ', '-')
    print(slug)
except:
    print('')
" 2>/dev/null)
          if [ -z "$SLUG" ]; then
            echo "No valid slug — skipping Godot export"
            exit 0
          fi
          echo "GODOT_SLUG=$SLUG" >> $GITHUB_ENV
          echo "Godot slug: $SLUG"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name  "universe-bot[bot]"
          git config user.email "universe-bot[bot]@users.noreply.github.com"

          git add universe.json          2>/dev/null || true
          git add products.json          2>/dev/null || true
          git add agent-results/         2>/dev/null || true
          git add godot-projects/        2>/dev/null || true
          git add public/                2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          MODE="${{ github.event.inputs.mode || 'auto' }}"

          # ✅ إصلاح: variable مباشرة بدل /tmp/commit_msg.txt + إزالة الإيموجي
          COMMIT_MSG=$(python-3.14.5-amd64 -c "
import json
try:
    r = json.load(open('agent-results/run-report.json'))
    u = json.load(open('universe.json'))
    mode = '$MODE'
    evo  = u.get('evolutions', 0)
    if mode == 'birth':
        msg = 'BIRTH: Universe ' + str(u.get('id', '')) + ' created'
    else:
        agents = list(r.get('agents', {}).keys()) if r.get('agents') else []
        if   'world'   in str(agents): kind = 'New world'
        elif 'weapon'  in str(agents): kind = 'New weapon'
        elif 'enemy'   in str(agents): kind = 'New enemy'
        elif 'vehicle' in str(agents): kind = 'New vehicle'
        else: kind = 'Evolution'
        msg = kind + ' added - Evolution #' + str(evo) + ' [skip ci]'
    print(msg)
except Exception as e:
    print('Universe evolution [skip ci]')
" 2>/dev/null || echo "Universe evolution [skip ci]")

          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main || git rebase --abort
          git push origin main --force-with-lease
          echo "Committed: $COMMIT_MSG"

      - name: Summary
        if: always()
        shell: bash
        run: |
          # ✅ إصلاح: python-3.14.5-amd64 + إزالة الإيموجي من التقرير
          python-3.14.5-amd64 -c "
import json, sys
try:
    r = json.load(open('agent-results/run-report.json'))
    u = json.load(open('universe.json'))
    lines = []
    lines.append('## Universe Evolution Report')
    lines.append('')
    lines.append('**Mode:** ' + str(r.get('mode', '')))
    lines.append('**Duration:** ' + str(r.get('totalDuration', '')))
    lines.append('**Gemini calls:** ' + str(r.get('geminiCalls', 0)))
    passed = r.get('summary', {}).get('passed', 0)
    total  = r.get('summary', {}).get('total', 0)
    lines.append('**Passed:** ' + str(passed) + ' / ' + str(total))
    lines.append('')
    lines.append('### Universe: ' + str(u.get('name', {}).get('en', '')))
    lines.append('- Evolutions: **' + str(u.get('evolutions', 0)) + '**')
    lines.append('- Worlds: **'   + str(len(u.get('worlds',   []))) + '**')
    lines.append('- Weapons: **'  + str(len(u.get('weapons',  []))) + '**')
    lines.append('- Enemies: **'  + str(len(u.get('enemies',  []))) + '**')
    lines.append('- Vehicles: **' + str(len(u.get('vehicles', []))) + '**')
    print('\n'.join(lines))
except Exception as e:
    print('No data: ' + str(e))
" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
