name: Generate Games & Deploy

on:
  push:
    paths:
      - 'game-generator.js'
      - 'templates/**'
      - 'products.json'
      - 'public/games/godot/**'
  workflow_dispatch:

jobs:
  generate-deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate game pages
        shell: bash
        run: node game-generator.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name  "universe-bot[bot]"
          git config user.email "universe-bot[bot]@users.noreply.github.com"

          git add universe.json          2>/dev/null || true
          git add products.json          2>/dev/null || true
          git add agent-results/         2>/dev/null || true
          git add godot-projects/        2>/dev/null || true
          git add public/                2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Deploy latest changes [skip ci]"
          git pull --rebase origin main || git rebase --abort
          git push origin main --force-with-lease
          echo "Committed successfully"
