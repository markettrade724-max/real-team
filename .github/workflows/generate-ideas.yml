name: generate-ideas

# هذا الـ workflow أصبح مُدمجاً في run-all-agents.yml
# يُبقى هنا للتشغيل اليدوي فقط — يُشغّل orchestrator مباشرة

on:
  schedule:
    - cron: '0 2 * * 1'   # كل إثنين 2 صباحاً UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: false
        default: 'birth'
        type: choice
        options:
          - birth
          - code
          - episode

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ← npm install أولاً دائماً
      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Create required directories
        shell: pwsh
        run: |
          $dirs = @("agent-results","public","godot-recipes","library","scripts")
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
          Write-Host "[OK] Directories ready"

      - name: Run orchestrator
        shell: pwsh
        timeout-minutes: 75
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL:          https://real-team.vercel.app
          MODE:              ${{ github.event.inputs.mode || 'birth' }}
        run: node orchestrator.js

      - name: Copy products to public
        shell: pwsh
        run: |
          if (Test-Path "products.json") {
            Copy-Item products.json public/products.json -Force
            Write-Host "[OK] products.json copied"
          }

      - name: Commit and push
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE:         ${{ github.event.inputs.mode || 'birth' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY

          git add agent-results/ library/ products.json public/products.json 2>$null
          if (Test-Path "universe.json")  { git add universe.json }
          if (Test-Path "progress.json")  { git add progress.json }
          if (Test-Path "godot-projects") { git add godot-projects/ }

          $diff = git diff --staged --name-only
          if (-not $diff) { Write-Host "[INFO] No changes"; exit 0 }

          $date = Get-Date -Format "yyyy-MM-dd HH:mm"
          git commit -m "agents: $env:MODE run $date [skip ci]"

          for ($i = 1; $i -le 3; $i++) {
            git pull --rebase origin main 2>$null
            if ($LASTEXITCODE -ne 0) { git rebase --abort 2>$null; Start-Sleep -Seconds 10; continue }
            git push origin main
            if ($LASTEXITCODE -eq 0) { Write-Host "[OK] Pushed"; break }
          }
