name: generate-ideas

on:
  schedule:
    - cron: '0 9 * * 1'  # كل إثنين الساعة 9 صباحاً
  workflow_dispatch:       # تشغيل يدوي

jobs:
  generate:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate new idea
        run: node scripts/generate-ideas.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}

      - name: Generate levels for existing games
        run: node scripts/generate-levels.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}

      - name: Rebuild games
        run: node game-generator.js

      - name: Commit changes
        run: |
          git config user.name  "gemini-bot[bot]"
          git config user.email "gemini-bot@users.noreply.github.com"
          git add products.json public/games/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Gemini: new idea + levels [skip ci]"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            git push origin main --force-with-lease
          fi
      - name: Install dependencies
        run: npm install
