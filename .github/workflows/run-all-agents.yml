name: run-all-agents

on:
  schedule:
    - cron: '0 5 * * *'   # 5 صباحاً UTC — التشغيل الرئيسي
    - cron: '0 7 * * *'   # 7 صباحاً UTC — التشغيل الثاني
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - birth
          - screenplay
          - production
          - game-phase1
          - game-phase2
          - inventor
          - library
          - sync

jobs:
  orchestrate:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write

    steps:
      # ══════════════════════════════════════════════════════
      # 1 — إعداد البيئة
      # ══════════════════════════════════════════════════════
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Create required directories
        shell: pwsh
        run: |
          $dirs = @(
            "agent-results",
            "public",
            "godot-recipes",
            "library",
            "assets/music",
            "assets/fonts",
            "episodes",
            "series",
            "scripts"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          Write-Host "[OK] Directories ready"

      - name: Create fallback image
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/fallback.png")) {
            $bytes = [Convert]::FromBase64String(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
            )
            [System.IO.File]::WriteAllBytes("assets/fallback.png", $bytes)
            Write-Host "[OK] fallback.png created"
          }

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: piper
          key: piper-voices-v1-${{ runner.os }}

      - name: Install Piper TTS + voices
        shell: pwsh
        run: |
          $piperDir = "piper"
          New-Item -ItemType Directory -Force -Path $piperDir | Out-Null

          # ── Binary ──────────────────────────────────────
          if (-not (Test-Path "$piperDir/piper.exe")) {
            Write-Host "[INFO] Downloading Piper binary..."
            Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile "piper.zip"
            Expand-Archive -Path "piper.zip" -DestinationPath "." -Force
            Remove-Item "piper.zip"
            Write-Host "[OK] Piper binary ready"
          } else {
            Write-Host "[OK] Piper binary cached"
          }

          # ── النماذج الصوتية — 4 إنجليزية + 4 فرنسية ──────
          $voices = @(
            @{ lang="en"; name="en_US-joe-medium" },
            @{ lang="en"; name="en_US-hfc_female-medium" },
            @{ lang="en"; name="en_GB-alan-medium" },
            @{ lang="en"; name="en_US-kristin-medium" },
            @{ lang="fr"; name="fr_FR-tom-medium" },
            @{ lang="fr"; name="fr_FR-upmc-medium" },
            @{ lang="fr"; name="fr_FR-gilles-low" },
            @{ lang="fr"; name="fr_FR-siwis-medium" }
          )

          foreach ($v in $voices) {
            $name = $v.name
            $lang = $v.lang
            # استخراج locale وspeaker وquality من الاسم: en_US-joe-medium
            $parts   = $name -split '-'
            $locale  = $parts[0]                  # en_US
            $speaker = $parts[1]                  # joe
            $quality = $parts[2]                  # medium
            $localeShort = $locale -split '_' | Select-Object -First 1  # en

            $baseUrl = "https://huggingface.co/rhasspy/piper-voices/resolve/main/$localeShort/$locale/$speaker/$quality"
            $onnxPath = "$piperDir/$name.onnx"
            $jsonPath = "$piperDir/$name.onnx.json"

            if (-not (Test-Path $onnxPath)) {
              Write-Host "[INFO] Downloading voice: $name"
              try {
                Invoke-WebRequest -Uri "$baseUrl/$name.onnx" -OutFile $onnxPath -ErrorAction Stop
                Invoke-WebRequest -Uri "$baseUrl/$name.onnx.json" -OutFile $jsonPath -ErrorAction Stop
                Write-Host "[OK] $name ready"
              } catch {
                Write-Warning "[WARN] Failed to download $name — $($_.Exception.Message)"
              }
            } else {
              Write-Host "[OK] $name cached"
            }
          }

          Write-Host "[OK] Piper TTS setup complete"

      # ══════════════════════════════════════════════════════
      # 2 — فحص ما قبل التشغيل
      # ══════════════════════════════════════════════════════
      - name: Pre-flight check
        shell: pwsh
        run: |
          $mode = "${{ github.event.inputs.mode || 'auto' }}"
          Write-Host "[INFO] === pre-flight check ==="
          Write-Host "[INFO] Mode: $mode"

          # فحص progress.json
          if (Test-Path "progress.json") {
            try {
              $pg = Get-Content "progress.json" | ConvertFrom-Json
              Write-Host "[OK] progress.json valid"

              # تنبيه إذا كانت المهمة فاشلة من الأسبوع الماضي
              if ($pg.current -and $pg.current.failReason) {
                Write-Host "[WARN] Last task failed: $($pg.current.failReason)"
                Write-Host "[WARN] Will retry: $($pg.current.type)"
              }

              # تقدم الحلقة
              $ep = $pg.series.nextEpisode
              if ($pg.series.episodes."$ep") {
                $epState = $pg.series.episodes."$ep"
                $done    = $epState.completedSteps -join ", "
                $pending = ($epState.pendingSteps -join ", ")
                Write-Host "[INFO] Episode $ep — done: [$done] pending: [$pending]"
              } else {
                Write-Host "[INFO] Episode $ep — not started yet"
              }

              # تقدم اللعبة
              if ($pg.games.current) {
                $g = $pg.games.current
                Write-Host "[INFO] Game $($g.id) — files done: $($g.completedFiles.Count) pending: $($g.pendingFiles.Count)"
              } else {
                Write-Host "[INFO] No game in progress"
              }
            } catch {
              Write-Host "[WARN] progress.json unreadable — will reset on run"
            }
          } else {
            Write-Host "[INFO] No progress.json — first run"
          }

          # فحص الحصة المتبقية
          Write-Host "[INFO] === quota check ==="
          $totalLeft = 0
          foreach ($file in @("library/budget.json","library/budget2.json")) {
            $label = if ($file -match "budget2") { "KEY_2" } else { "KEY_1" }
            if (Test-Path $file) {
              try {
                $b    = Get-Content $file | ConvertFrom-Json
                $left = $b.limit - $b.total
                $totalLeft += $left
                Write-Host "[INFO] ${label}: $($b.total)/$($b.limit) used — $left left"
              } catch {
                $totalLeft += 20
                Write-Host "[WARN] ${label}: unreadable budget — assuming 20 left"
              }
            } else {
              $totalLeft += 20
              Write-Host "[INFO] ${label}: not initialized — assuming 20 left"
            }
          }
          Write-Host "[INFO] TOTAL left today: $totalLeft/40"

          # تنبيه إذا كانت الحصة غير كافية لمهمة اليوم
          $needed = @{
            "library"      = 40; "inventor"     = 40
            "screenplay"   = 3;  "production"   = 0
            "game-phase1"  = 4;  "game-phase2"  = 5
          }
          if ($mode -ne "auto" -and $needed.ContainsKey($mode)) {
            $req = $needed[$mode]
            if ($totalLeft -lt $req) {
              Write-Host "[WARN] Quota insufficient for $mode — need $req have $totalLeft"
            } else {
              Write-Host "[OK] Quota sufficient for $mode — need $req have $totalLeft"
            }
          }

      # ══════════════════════════════════════════════════════
      # 3 — تشغيل الـ orchestrator
      # ══════════════════════════════════════════════════════
      - name: Run orchestrator
        shell: pwsh
        timeout-minutes: 165
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:          ${{ secrets.GEMINI_API_KEY_2 }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN:       ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_USERNAME:           ${{ secrets.TIKTOK_USERNAME }}
          UNSPLASH_ACCESS_KEY:       ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_REPOSITORY:         ${{ github.repository }}
          SITE_URL:                  https://real-team.vercel.app
          MODE:                      ${{ github.event.inputs.mode || 'auto' }}
        run: node orchestrator.js

      # ══════════════════════════════════════════════════════
      # 4 — تقرير النتائج
      # ══════════════════════════════════════════════════════
      - name: Show results
        if: always()
        shell: pwsh
        run: |
          Write-Host "[INFO] ══════════════════════════════════"
          Write-Host "[INFO]         RESULTS REPORT"
          Write-Host "[INFO] ══════════════════════════════════"

          # تقرير التشغيل
          if (Test-Path "agent-results/run-report.json") {
            $r = Get-Content "agent-results/run-report.json" | ConvertFrom-Json
            $status = if ($r.success) { "[OK]" } else { "[FAIL]" }
            Write-Host "$status Mode:     $($r.mode)"
            Write-Host "$status Duration: $($r.totalDuration)"
            Write-Host "$status Passed:   $($r.summary.passed)"
            Write-Host "$status Failed:   $($r.summary.failed)"

            # تفاصيل كل وكيل
            if ($r.agents) {
              Write-Host "[INFO] --- agents ---"
              $r.agents.PSObject.Properties | ForEach-Object {
                $icon = if ($_.Value.success) { "[OK]" } else { "[FAIL]" }
                $err  = if ($_.Value.error)   { " — $($_.Value.error)" } else { "" }
                Write-Host "$icon $($_.Name): $($_.Value.duration)$err"
              }
            }
          } else {
            Write-Host "[WARN] No run report found"
          }

          # الحصة بعد التشغيل
          Write-Host "[INFO] --- quota after run ---"
          $totalLeft = 0
          foreach ($file in @("library/budget.json","library/budget2.json")) {
            $label = if ($file -match "budget2") { "KEY_2" } else { "KEY_1" }
            if (Test-Path $file) {
              try {
                $b    = Get-Content $file | ConvertFrom-Json
                $left = $b.limit - $b.total
                $totalLeft += $left
                Write-Host "[INFO] ${label}: $($b.total)/$($b.limit) used — $left left"
              } catch {
                $totalLeft += 20
              }
            }
          }
          Write-Host "[INFO] TOTAL left today: $totalLeft/40"

          # تقدم الحلقة والألعاب
          Write-Host "[INFO] --- progress ---"
          if (Test-Path "progress.json") {
            $pg = Get-Content "progress.json" | ConvertFrom-Json

            # الحلقة
            $ep      = $pg.series.nextEpisode
            $epDone  = $pg.series.totalEpisodes
            if ($pg.series.episodes."$ep") {
              $epState  = $pg.series.episodes."$ep"
              $backbone = if ($epState.completedSteps -contains "backbone")  { "done" } else { "pending" }
              $scenes   = if ($epState.completedSteps -contains "scenes")    { "done" } else { "pending" }
              $dialogue = if ($epState.completedSteps -contains "dialogue")  { "done" } else { "pending" }
              Write-Host "[OK] Episode $ep — backbone:$backbone scenes:$scenes dialogue:$dialogue"
            } else {
              Write-Host "[INFO] Episode $ep — not started"
            }
            Write-Host "[OK] Episodes complete: $epDone"

            # اللعبة
            if ($pg.games.current) {
              $g      = $pg.games.current
              $phase  = if ($g.completedFiles.Count -lt 5) { "phase1" } else { "phase2" }
              Write-Host "[OK] Game $($g.id) — $phase — files: $($g.completedFiles.Count)/10"
            } else {
              Write-Host "[INFO] No game in progress"
            }
            Write-Host "[OK] Games complete: $($pg.games.done.Count)"
          } else {
            Write-Host "[INFO] No progress.json yet"
          }

          # universe
          Write-Host "[INFO] --- universe ---"
          if (Test-Path "universe.json") {
            $u = Get-Content "universe.json" | ConvertFrom-Json
            Write-Host "[OK] $($u.id) | Worlds: $($u.worlds.Count) | Evolutions: $($u.evolutions) | Inventions: $($u.inventions)"
          } else {
            Write-Host "[WARN] No universe yet"
          }

          # المكتبة
          Write-Host "[INFO] --- library ---"
          if (Test-Path "agent-results/run-report.json") {
            $r = Get-Content "agent-results/run-report.json" | ConvertFrom-Json
            Write-Host "[OK] $($r.library.percent) ($($r.library.built)/$($r.library.total))"
          }

          # المنتجات
          Write-Host "[INFO] --- products ---"
          if (Test-Path "products.json") {
            node -e "try{const p=JSON.parse(require('fs').readFileSync('products.json'));console.log('[OK] Products:',p.length);}catch(e){console.error('[ERROR]',e.message);}"
          }

      # ══════════════════════════════════════════════════════
      # 5 — نسخ الملفات العامة
      # ══════════════════════════════════════════════════════
      - name: Copy products to public
        shell: pwsh
        run: |
          if (Test-Path "products.json") {
            Copy-Item products.json public/products.json -Force
            Write-Host "[OK] products.json copied to public/"
          } else {
            Write-Host "[WARN] products.json not found"
          }
          if (Test-Path "series.json") {
            Copy-Item series.json public/series.json -Force
            Write-Host "[OK] series.json copied to public/"
          } else {
            Write-Host "[WARN] series.json not found"
          }

      # ══════════════════════════════════════════════════════
      # 6 — رفع artifact الحلقة
      # ══════════════════════════════════════════════════════
      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        if: |
          always() && (
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
             contains(fromJson('["screenplay","production","auto"]'),
             github.event.inputs.mode))
          )
        with:
          name: episode-${{ github.run_number }}
          path: |
            episodes/
            series.json
          retention-days: 30

      # ══════════════════════════════════════════════════════
      # 7 — Commit + Push مع retry — rule-158, rule-159
      # ══════════════════════════════════════════════════════
      - name: Commit and push
        shell: pwsh
        env:
          MODE:         ${{ github.event.inputs.mode || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY

          git add -f agent-results/       2>$null
          git add    library/             2>$null
          git add    series.json          2>$null
          git add    products.json        2>$null
          git add    public/products.json 2>$null
          git add    public/series.json   2>$null
          if (Test-Path "progress.json")  { git add progress.json }
          if (Test-Path "public/games")   { git add public/games/ }
          if (Test-Path "universe.json")  { git add universe.json }
          if (Test-Path "godot-projects") { git add godot-projects/ }
          if (Test-Path "godot-recipes")  { git add godot-recipes/ }
          if (Test-Path "episodes")       { git add episodes/ }
          if (Test-Path "assets")         { git add assets/ }

          $diff = git diff --staged --name-only
          if (-not $diff) {
            Write-Host "[INFO] No changes to commit"
            exit 0
          }

          # commit message يعكس المهمة الفعلية — rule-158
          $msg = switch ($env:MODE) {
            "screenplay"  { "agents: screenplay done [skip ci]" }
            "production"  { "agents: episode produced [skip ci]" }
            "game-phase1" { "agents: game phase1 done [skip ci]" }
            "game-phase2" { "agents: game phase2 done [skip ci]" }
            "inventor"    { "agents: inventor done [skip ci]" }
            "library"     { "agents: library updated [skip ci]" }
            "birth"       { "agents: universe born [skip ci]" }
            "sync"        { "agents: sync done [skip ci]" }
            default {
              # auto — اقرأ المهمة الفعلية من التقرير
              $task = "auto"
              if (Test-Path "agent-results/run-report.json") {
                try {
                  $r    = Get-Content "agent-results/run-report.json" | ConvertFrom-Json
                  $task = $r.mode
                } catch {}
              }
              "agents: $task done [skip ci]"
            }
          }

          git commit -m $msg

          # push مع retry — rule-159
          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "[INFO] Push attempt $i/3..."
            git stash
            git pull --rebase origin main 2>$null
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              git stash pop   2>$null
              Start-Sleep -Seconds (10 * $i)
              continue
            }
            git stash pop 2>$null
            git push origin main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              Write-Host "[OK] Changes pushed"
              break
            }
            Start-Sleep -Seconds (10 * $i)
          }

          if (-not $pushed) {
            Write-Error "[FAIL] Push failed after 3 retries"
            exit 1
          }

      # ══════════════════════════════════════════════════════
      # 8 — QA bot مع retry
      # ══════════════════════════════════════════════════════
      - name: Wait for Vercel deploy
        shell: pwsh
        run: |
          Write-Host "[INFO] Waiting for Vercel deploy..."
          $ready = $false
          for ($i = 1; $i -le 6; $i++) {
            Start-Sleep -Seconds 15
            try {
              $res = Invoke-WebRequest -Uri "$env:SITE_URL/products.json" `
                       -UseBasicParsing -TimeoutSec 10 -ErrorAction Stop
              if ($res.StatusCode -eq 200) {
                Write-Host "[OK] Vercel ready after $($i * 15)s"
                $ready = $true
                break
              }
            } catch {
              Write-Host "[INFO] Not ready yet — attempt $i/6"
            }
          }
          if (-not $ready) {
            Write-Host "[WARN] Vercel not confirmed ready — running QA anyway"
          }
        env:
          SITE_URL: https://real-team.vercel.app

      - name: Run QA bot
        shell: pwsh
        env:
          SITE_URL: https://real-team.vercel.app
        run: |
          $passed = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "[INFO] QA attempt $i/3..."
            node scripts/qa-bot.js
            if ($LASTEXITCODE -eq 0) {
              $passed = $true
              Write-Host "[OK] QA passed"
              break
            }
            if ($i -lt 3) { Start-Sleep -Seconds 20 }
          }
          if (-not $passed) {
            Write-Host "[WARN] QA failed after 3 attempts — check qa-results.json"
          }

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ github.run_number }}
          path: qa-results.json
          retention-days: 7
