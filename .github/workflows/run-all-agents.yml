name: run-all-agents

on:
  schedule:
    - cron: '0 8  * * *'   # 8 صباحاً UTC — التشغيل الرئيسي
    - cron: '0 14 * * *'   # 2 ظهراً UTC  — التشغيل الثاني
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - birth
          - episode
          - invention
          - revival
          - sync
          - code
          - library

jobs:
  orchestrate:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write

    steps:
      # ══════════════════════════════════════════════════════
      # 1 — إعداد البيئة
      # ══════════════════════════════════════════════════════
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Create required directories
        shell: pwsh
        run: |
          $dirs = @(
            "agent-results",
            "public",
            "godot-recipes",
            "library",
            "assets/music",
            "assets/fonts",
            "episodes",
            "series",
            "scripts"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          Write-Host "[OK] Directories ready"

      - name: Create fallback image
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/fallback.png")) {
            $bytes = [Convert]::FromBase64String(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
            )
            [System.IO.File]::WriteAllBytes("assets/fallback.png", $bytes)
            Write-Host "[OK] fallback.png created"
          }

      # ══════════════════════════════════════════════════════
      # 2 — تشغيل الـ orchestrator
      # ══════════════════════════════════════════════════════
      - name: Run orchestrator
        shell: pwsh
        timeout-minutes: 75
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:          ${{ secrets.GEMINI_API_KEY_2 }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN:       ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_USERNAME:           ${{ secrets.TIKTOK_USERNAME }}
          UNSPLASH_ACCESS_KEY:       ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_REPOSITORY:         ${{ github.repository }}
          SITE_URL:                  https://real-team.vercel.app
          MODE:                      ${{ github.event.inputs.mode || 'auto' }}
        run: node orchestrator.js

      # ══════════════════════════════════════════════════════
      # 3 — تقرير النتائج
      # ══════════════════════════════════════════════════════
      - name: Show results
        if: always()
        shell: pwsh
        run: |
          Write-Host "[INFO] === run report ==="
          if (Test-Path "agent-results/run-report.json") {
            $r = Get-Content "agent-results/run-report.json" | ConvertFrom-Json
            Write-Host "[INFO] Mode:     $($r.mode)"
            Write-Host "[INFO] Duration: $($r.totalDuration)"
            Write-Host "[INFO] Passed:   $($r.summary.passed)"
            Write-Host "[INFO] Failed:   $($r.summary.failed)"
            Write-Host "[INFO] Library:  $($r.library.percent)% ($($r.library.built)/$($r.library.total))"
          } else {
            Write-Warning "[WARN] No run report found"
          }

          Write-Host "[INFO] === budget (KEY_1 + KEY_2) ==="
          $totalLeft = 0
          foreach ($file in @("library/budget.json","library/budget2.json")) {
            $label = if ($file -match "budget2") { "KEY_2" } else { "KEY_1" }
            if (Test-Path $file) {
              $b = Get-Content $file | ConvertFrom-Json
              $left = $b.limit - $b.total
              $totalLeft += $left
              Write-Host "[INFO] ${label}: $($b.total)/$($b.limit) used — $left left"
            } else {
              Write-Host "[INFO] ${label}: not initialized yet"
              $totalLeft += 20
            }
          }
          Write-Host "[INFO] TOTAL left today: $totalLeft/40"

          Write-Host "[INFO] === progress ==="
          if (Test-Path "progress.json") {
            $pg  = Get-Content "progress.json" | ConvertFrom-Json
            $cur = if ($pg.current) {
              $ep = if ($null -ne $pg.current.episode) { $pg.current.episode } else { $pg.current.id }
              "$($pg.current.type):$ep"
            } else { "none" }
            Write-Host "[OK] Current:       $cur"
            Write-Host "[OK] Next episode:  $($pg.series.nextEpisode)"
            Write-Host "[OK] Episodes done: $($pg.series.totalEpisodes)"
            Write-Host "[OK] Games done:    $($pg.games.done.Count)"
          } else {
            Write-Host "[INFO] No progress.json yet — first run"
          }

          Write-Host "[INFO] === universe ==="
          if (Test-Path "universe.json") {
            $u = Get-Content "universe.json" | ConvertFrom-Json
            Write-Host "[OK] $($u.id) | Worlds: $($u.worlds.Count) | Evolutions: $($u.evolutions)"
          } else {
            Write-Warning "[WARN] No universe yet"
          }

          Write-Host "[INFO] === series ==="
          if (Test-Path "series.json") {
            $s = Get-Content "series.json" | ConvertFrom-Json
            Write-Host "[OK] $($s.title) | Episodes: $($s.episodes.Count) | Next: $($s.nextEpisode)"
          } else {
            Write-Host "[INFO] No series yet"
          }

          Write-Host "[INFO] === library ==="
          if (Test-Path "library/index.json") {
            $l = Get-Content "library/index.json" | ConvertFrom-Json
            Write-Host "[OK] $($l.Count) references built"
          } else {
            Write-Host "[INFO] Library empty"
          }

          Write-Host "[INFO] === products ==="
          if (Test-Path "products.json") {
            node -e "try{const p=JSON.parse(require('fs').readFileSync('products.json'));console.log('[OK] Products:',p.length);}catch(e){console.error('[ERROR]',e.message);}"
          }

      # ══════════════════════════════════════════════════════
      # 4 — نسخ الملفات العامة
      # ══════════════════════════════════════════════════════
      - name: Copy products to public
        shell: pwsh
        run: |
          if (Test-Path "products.json") {
            Copy-Item products.json public/products.json -Force
            Write-Host "[OK] products.json copied to public/"
          } else {
            Write-Warning "[WARN] products.json not found"
          }

      # ══════════════════════════════════════════════════════
      # 5 — رفع artifact الحلقة
      # ══════════════════════════════════════════════════════
      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        if: |
          always() && (
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' &&
             contains(github.event.inputs.mode, 'episode'))
          )
        with:
          name: episode-${{ github.run_number }}
          path: |
            episodes/
            series.json
          retention-days: 30

      # ══════════════════════════════════════════════════════
      # 6 — Commit + Push مع retry — rule-158, rule-159
      # ══════════════════════════════════════════════════════
      - name: Commit and push
        shell: pwsh
        env:
          MODE:         ${{ github.event.inputs.mode || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY

          git add -f agent-results/       2>$null
          git add    library/             2>$null
          git add    series.json          2>$null
          git add    products.json        2>$null
          git add    public/products.json 2>$null
          if (Test-Path "progress.json")   { git add progress.json }
          if (Test-Path "public/games")    { git add public/games/ }
          if (Test-Path "universe.json")   { git add universe.json }
          if (Test-Path "godot-projects")  { git add godot-projects/ }
          if (Test-Path "godot-recipes")   { git add godot-recipes/ }

          $diff = git diff --staged --name-only
          if (-not $diff) {
            Write-Host "[INFO] No changes to commit"
            exit 0
          }

          $date = Get-Date -Format "yyyy-MM-dd HH:mm"
          git commit -m "agents: $env:MODE run $date [skip ci]"

          # push مع retry — rule-159
          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "[INFO] Push attempt $i/3..."
            git pull --rebase origin main 2>$null
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              Start-Sleep -Seconds (10 * $i)
              continue
            }
            git push origin main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              Write-Host "[OK] Changes pushed"
              break
            }
            Start-Sleep -Seconds (10 * $i)
          }

          if (-not $pushed) {
            Write-Error "[FAIL] Push failed after 3 retries"
            exit 1
          }

      # ══════════════════════════════════════════════════════
      # 7 — QA bot بعد الـ deploy
      # ══════════════════════════════════════════════════════
      - name: Wait for Vercel deploy
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Run QA bot
        shell: pwsh
        env:
          SITE_URL: https://real-team.vercel.app
        run: node scripts/qa-bot.js

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa-results.json
          retention-days: 7
