name: godot-export

on:
  push:
    branches: [main]
    paths:
      - 'godot-projects/**'
  workflow_dispatch:
    inputs:
      project-slug:
        description: 'Slug of project to export (leave empty for all)'
        required: false

jobs:
  export-godot:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v3
        with:
          path: C:\godot
          key: godot-4.6.2-windows-x86_64

      - name: Download Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\godot
          Invoke-WebRequest -Uri https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip -OutFile C:\godot\godot.zip
          Expand-Archive -Path C:\godot\godot.zip -DestinationPath C:\godot
          Remove-Item C:\godot\godot.zip

      - name: Cache Godot Export Templates
        id: cache-templates
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\AppData\Roaming\Godot\export_templates\4.6.2.stable
          key: godot-templates-4.6.2-stable

      - name: Download Godot Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $TemplatesDir = "$env:APPDATA\Godot\export_templates\4.6.2.stable"
          New-Item -ItemType Directory -Force -Path $TemplatesDir
          Invoke-WebRequest -Uri https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz -OutFile C:\templates.tpz
          Expand-Archive -Path C:\templates.tpz -DestinationPath C:\templates_extracted
          Get-ChildItem -Path C:\templates_extracted\templates\* | Move-Item -Destination $TemplatesDir -Force
          Remove-Item C:\templates.tpz -Force
          Remove-Item C:\templates_extracted -Recurse -Force
          Write-Host "Templates installed"

      - name: Verify Export Templates
        shell: pwsh
        run: |
          $TemplatesDir = "$env:APPDATA\Godot\export_templates\4.6.2.stable"
          if (-not (Test-Path $TemplatesDir) -or (Get-ChildItem $TemplatesDir | Measure-Object).Count -eq 0) {
            Write-Host "Templates not found!"
            exit 1
          }
          Write-Host "Templates found"

      - name: Export Godot projects
        shell: pwsh
        run: |
          $GodotBin = "C:\godot\Godot_v4.6.2-stable_win64.exe"
          if (-not (Test-Path $GodotBin)) {
            Write-Host "Godot not found!"
            exit 1
          }

          $projects = Get-ChildItem -Path godot-projects -Filter project.godot -Recurse -File
          if ($projects.Count -eq 0) {
            Write-Host "No projects"
            exit 1
          }

          foreach ($proj in $projects) {
            $projDir = $proj.DirectoryName
            $slug = $proj.Directory.Name
            Write-Host "Exporting: $slug"

            $OutputDir = "$pwd\public\games\godot\$slug"
            New-Item -ItemType Directory -Force -Path $OutputDir

            $presetPath = Join-Path $projDir "export_presets.cfg"
            if (-not (Test-Path $presetPath)) {
              Write-Host "Creating default export_presets.cfg..."
              @"
[preset.0]

name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="./index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/import_etc2_astc=true
vram_texture_compression/import_s3tc_bptc=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progress/as_bar=false
"@ | Out-File -FilePath $presetPath -Encoding utf8
              Write-Host "Default export_presets.cfg created"
            }

            & $GodotBin --headless --path $projDir --export-release "Web" "$OutputDir\index.html"

            $filesToCheck = @("index.html", "index.js", "index.wasm", "index.pck")
            $failed = $false
            foreach ($file in $filesToCheck) {
              $path = Join-Path $OutputDir $file
              if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
                Write-Host "FAILED: $file is empty or missing"
                $failed = $true
              }
            }
            if ($failed) {
              exit 1
            }
            Write-Host "All essential files are intact (single-threaded)"
            Write-Host "Export successful"
          }

      - name: Commit exported files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (Test-Path "public\games\godot" -PathType Container) {
            git add public/games/godot/
          }
          $diff = git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes"
            exit 0
          }
          git commit -m "Auto-export Godot games (single-threaded) [skip ci]"
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) {
            git rebase --abort
            exit 1
          }
          git push origin main --force-with-lease
