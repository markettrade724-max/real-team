name: godot-export

on:
  push:
    branches: [main]
    paths:
      - 'godot-projects/**'
  workflow_dispatch:
    inputs:
      project-slug:
        description: 'Slug of project to export (leave empty for all)'
        required: false

jobs:
  export-godot:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v3
        with:
          path: C:\godot
          key: godot-4.6.2-windows-x86_64

      - name: Download Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p /c/godot
          curl -L -o /c/godot/godot.zip https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip
          unzip -q /c/godot/godot.zip -d /c/godot
          rm /c/godot/godot.zip

      - name: Cache Godot Export Templates
        id: cache-templates
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\AppData\Roaming\Godot\export_templates\4.6.2.stable
          key: godot-templates-4.6.2-stable

      - name: Download Godot Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          TEMPLATES_DIR="/c/Users/runneradmin/AppData/Roaming/Godot/export_templates/4.6.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATES_DIR/"
          rm -rf /tmp/templates /tmp/templates.tpz
          echo "Templates installed"

      - name: Verify Export Templates
        shell: bash
        run: |
          TEMPLATES_DIR="/c/Users/runneradmin/AppData/Roaming/Godot/export_templates/4.6.2.stable"
          if [ ! -d "$TEMPLATES_DIR" ] || [ -z "$(ls -A $TEMPLATES_DIR)" ]; then
            echo "Templates not found!"
            exit 1
          fi
          echo "Templates found"

      - name: Export Godot projects
        shell: bash
        run: |
          GODOT_BIN="/c/godot/Godot_v4.6.2-stable_win64.exe"
          if [ ! -f "$GODOT_BIN" ]; then
            echo "Godot not found!"
            exit 1
          fi

          FOUND_PROJECTS=$(find godot-projects -name "project.godot" -type f 2>/dev/null)
          if [ -z "$FOUND_PROJECTS" ]; then
            echo "No projects"
            exit 1
          fi

          for proj_file in $FOUND_PROJECTS; do
            proj_dir=$(dirname "$proj_file")
            slug=$(basename "$proj_dir")
            echo "Exporting: $slug"

            OUTPUT_DIR="$(pwd)/public/games/godot/$slug"
            mkdir -p "$OUTPUT_DIR"

            # كتابة export_presets.cfg باستخدام بايثون (لا heredoc بعد اليوم)
            if [ ! -f "$proj_dir/export_presets.cfg" ]; then
              echo "Creating default export_presets.cfg..."
              python -c "
cfg = '''[preset.0]

name=\"Web\"
platform=\"Web\"
runnable=true
custom_features=\"\"
export_filter=\"all_resources\"
include_filter=\"\"
exclude_filter=\"\"
export_path=\"./index.html\"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/import_etc2_astc=true
vram_texture_compression/import_s3tc_bptc=true
html/custom_html_shell=\"\"
html/head_include=\"\"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progress/as_bar=false
'''
with open('$proj_dir/export_presets.cfg', 'w') as f:
    f.write(cfg)
"
              echo "Default export_presets.cfg created"
            fi

            godot --headless --path "$proj_dir" --export-release "Web" "$OUTPUT_DIR/index.html"

            if [ ! -s "$OUTPUT_DIR/index.html" ] || [ ! -s "$OUTPUT_DIR/index.js" ] || [ ! -s "$OUTPUT_DIR/index.wasm" ] || [ ! -s "$OUTPUT_DIR/index.pck" ]; then
              echo "FAILED: One of the essential files is empty or missing"
              exit 1
            fi
            echo "All essential files are intact (single-threaded)"
            echo "Export successful"
          done

      - name: Commit exported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "public/games/godot/" ] && [ "$(ls -A public/games/godot/ 2>/dev/null)" ]; then
            git add public/games/godot/
          fi
          if ! git diff --staged --quiet; then
            git commit -m "Auto-export Godot games (single-threaded) [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin main --force-with-lease
          else
            echo "No changes"
          fi
