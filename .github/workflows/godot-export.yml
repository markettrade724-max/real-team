name: Godot Export to HTML5

on:
  push:
    paths:
      - 'godot-projects/**'
  workflow_dispatch:
    inputs:
      project-slug:
        description: 'مُعرّف المشروع (اتركه فارغاً لتصدير الكل)'
        required: false

jobs:
  export-godot:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v3
        with:
          path: C:\godot
          key: godot-4.6.2-windows-x86_64

      - name: Download Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p /c/godot
          curl -L -o /c/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip
          unzip -q /c/godot/godot.zip -d /c/godot
          rm /c/godot/godot.zip

      - name: Cache Godot Export Templates
        id: cache-templates
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\AppData\Roaming\Godot\export_templates\4.6.2.stable
          key: godot-templates-4.6.2-stable

      - name: Download Godot Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          TEMPLATES_DIR="/c/Users/runneradmin/AppData/Roaming/Godot/export_templates/4.6.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -L -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATES_DIR/"
          rm -rf /tmp/templates /tmp/templates.tpz
          echo "Templates installed"
          ls "$TEMPLATES_DIR/" | grep web || ls "$TEMPLATES_DIR/"

      # ✅ إضافة: التحقق من Templates قبل التصدير
      - name: Verify Export Templates
        shell: bash
        run: |
          TEMPLATES_DIR="/c/Users/runneradmin/AppData/Roaming/Godot/export_templates/4.6.2.stable"
          if [ ! -d "$TEMPLATES_DIR" ] || [ -z "$(ls -A $TEMPLATES_DIR 2>/dev/null)" ]; then
            echo "Templates directory not found or empty"
            exit 1
          fi
          echo "Templates verified:"
          ls -lh "$TEMPLATES_DIR/" | grep -E "web|wasm" || ls -lh "$TEMPLATES_DIR/"

      - name: Export Godot projects
        shell: bash
        run: |
          GODOT_BIN="/c/godot/Godot_v4.6.2-stable_win64.exe"
          if [ ! -f "$GODOT_BIN" ]; then
            echo "Godot not found: $GODOT_BIN"
            exit 1
          fi
          echo "Godot found: $GODOT_BIN"

          FOUND_PROJECTS=$(find godot-projects -name "project.godot" -type f 2>/dev/null)
          if [ -z "$FOUND_PROJECTS" ]; then
            echo "No projects found in godot-projects/"
            exit 1
          fi

          echo "Found projects:"
          echo "$FOUND_PROJECTS"

          EXPORT_COUNT=0
          FAILED_COUNT=0

          for proj_file in $FOUND_PROJECTS; do
            proj_dir=$(dirname "$proj_file")
            slug=$(basename "$proj_dir")
            echo ""
            echo "Exporting: $slug"

            OUTPUT_DIR="$(pwd)/public/games/godot/$slug"
            mkdir -p "$OUTPUT_DIR"

            # ✅ إصلاح: Python بدل heredoc (heredoc يكسر YAML syntax)
            if [ ! -f "$proj_dir/export_presets.cfg" ]; then
              echo "Creating default export_presets.cfg..."
              python3 -c "
content = '''[preset.0]
name=\"Web\"
platform=\"Web\"
runnable=true
custom_features=\"\"
export_filter=\"all_resources\"
include_filter=\"\"
exclude_filter=\"\"
export_path=\"./index.html\"
encryption_include_filters=\"\"
encryption_exclude_filters=\"\"
script_encryption_key=\"\"
patches=PackedStringArray()

[preset.0.options]
custom_template/debug=\"\"
custom_template/release=\"\"
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=\"\"
html/head_include=\"\"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=\"\"
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=\"\"
progressive_web_app/icon_180x180=\"\"
progressive_web_app/icon_maskable_192x192=\"\"
progressive_web_app/icon_maskable_512x512=\"\"
progressive_web_app/background_color=Color(0, 0, 0, 1)
'''
import sys
with open(sys.argv[1], 'w') as f:
    f.write(content)
print('export_presets.cfg created')
" "$proj_dir/export_presets.cfg"
            else
              echo "export_presets.cfg found"
              # ✅ إصلاح: تصحيح الاسم إذا كان HTML5 بدل Web
              if grep -q 'name="HTML5"' "$proj_dir/export_presets.cfg"; then
                sed -i 's/name="HTML5"/name="Web"/' "$proj_dir/export_presets.cfg"
                echo "Preset name corrected: HTML5 -> Web"
              fi
            fi

            LOG_FILE="/tmp/godot-$slug.log"
            "$GODOT_BIN" \
              --headless \
              --path "$proj_dir" \
              --export-release "Web" "$OUTPUT_DIR/index.html" \
              > "$LOG_FILE" 2>&1

            GODOT_EXIT=$?

            if [ $GODOT_EXIT -ne 0 ]; then
              echo "Export FAILED (exit: $GODOT_EXIT)"
              cat "$LOG_FILE"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              continue
            fi

            # ✅ التحقق من الملفات الأربعة وحجمها
            ALL_OK=true
            for f in index.html index.js index.wasm index.pck; do
              if [ ! -f "$OUTPUT_DIR/$f" ] || [ ! -s "$OUTPUT_DIR/$f" ]; then
                echo "MISSING or EMPTY: $f"
                ALL_OK=false
              else
                SIZE=$(du -sh "$OUTPUT_DIR/$f" | cut -f1)
                echo "OK: $f ($SIZE)"
              fi
            done

            if [ "$ALL_OK" = false ]; then
              echo "Export incomplete for: $slug"
              cat "$LOG_FILE"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            else
              echo "Export successful: $slug"
              EXPORT_COUNT=$((EXPORT_COUNT + 1))
            fi

            rm -f "$LOG_FILE"
          done

          echo ""
          echo "SUMMARY"
          echo "Successful: $EXPORT_COUNT"
          echo "Failed:     $FAILED_COUNT"

          if [ $FAILED_COUNT -gt 0 ]; then
            exit 1
          fi

      - name: Commit exported files
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d "public/games/godot/" ] && [ "$(ls -A public/games/godot/ 2>/dev/null)" ]; then
            git add public/games/godot/
          fi

          if ! git diff --staged --quiet; then
            git commit -m "Auto-export Godot games [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin main --force-with-lease
            echo "Changes committed"
          else
            echo "No changes"
          fi
