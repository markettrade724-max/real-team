name: godot-export

on:
  push:
    paths:
      - 'godot-projects/**'
  workflow_dispatch:
    inputs:
      project-slug:
        description: 'مُعرّف المشروع (اتركه فارغاً لتصدير الكل)'
        required: false

jobs:
  export-godot:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v3
        with:
          path: C:\godot
          key: godot-4.6.2-windows-x86_64

      - name: Download Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p /c/godot
          curl -L -o /c/godot/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip
          unzip -q /c/godot/godot.zip -d /c/godot
          rm /c/godot/godot.zip
          echo "[OK] Godot downloaded"
          ls -la /c/godot/

      - name: Cache Godot Export Templates
        id: cache-templates
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\AppData\Roaming\Godot\export_templates\4.6.2.stable
          key: godot-templates-4.6.2-stable

      - name: Download Godot Export Templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          TEMPLATES_DIR="/c/Users/runneradmin/AppData/Roaming/Godot/export_templates/4.6.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -L -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATES_DIR/"
          rm -rf /tmp/templates /tmp/templates.tpz
          echo "[OK] Templates installed"
          ls "$TEMPLATES_DIR/" | head -5

      - name: Verify Export Templates
        shell: bash
        run: |
          TEMPLATES_DIR="/c/Users/runneradmin/AppData/Roaming/Godot/export_templates/4.6.2.stable"
          if [ ! -d "$TEMPLATES_DIR" ] || [ -z "$(ls -A $TEMPLATES_DIR 2>/dev/null)" ]; then
            echo "[FAIL] Templates not found"
            exit 1
          fi
          echo "[OK] Templates verified"
          ls "$TEMPLATES_DIR/" | grep -E "web|wasm" || echo "[WARN] No web templates found"

      - name: Export Godot projects
        shell: bash
        run: |
          GODOT_BIN="/c/godot/Godot_v4.6.2-stable_win64.exe"

          echo "[INFO] Checking Godot binary..."
          if [ ! -f "$GODOT_BIN" ]; then
            echo "[FAIL] Godot not found at $GODOT_BIN"
            ls -la /c/godot/
            exit 1
          fi
          echo "[OK] Godot found: $GODOT_BIN"

          # تحديد المشاريع للتصدير
          if [ -n "${{ github.event.inputs.project-slug }}" ]; then
            SLUG="${{ github.event.inputs.project-slug }}"
            FOUND_PROJECTS="godot-projects/$SLUG/project.godot"
            if [ ! -f "$FOUND_PROJECTS" ]; then
              echo "[FAIL] Project not found: $SLUG"
              exit 1
            fi
          else
            FOUND_PROJECTS=$(find godot-projects -name "project.godot" -type f 2>/dev/null)
          fi

          if [ -z "$FOUND_PROJECTS" ]; then
            echo "[WARN] No Godot projects found"
            exit 0
          fi

          echo "[INFO] Projects to export:"
          echo "$FOUND_PROJECTS"

          EXPORT_FAILED=false

          for proj_file in $FOUND_PROJECTS; do
            proj_dir=$(dirname "$proj_file")
            slug=$(basename "$proj_dir")
            echo ""
            echo "[INFO] Exporting: $slug"

            # تخطي المشاريع بدون ملفات GDScript
            if [ -z "$(find $proj_dir -name "*.gd" 2>/dev/null)" ]; then
              echo "[SKIP] No GDScript files found in $slug — skipping"
              continue
            fi

            OUTPUT_DIR="public/games/godot/$slug"
            mkdir -p "$OUTPUT_DIR"

            # التحقق من export_presets.cfg
            if [ ! -f "$proj_dir/export_presets.cfg" ]; then
              echo "[INFO] Creating export_presets.cfg for $slug..."
              echo "[preset.0]"                                  > "$proj_dir/export_presets.cfg"
              echo ""                                           >> "$proj_dir/export_presets.cfg"
              echo "name=\"Web\""                               >> "$proj_dir/export_presets.cfg"
              echo "platform=\"Web\""                          >> "$proj_dir/export_presets.cfg"
              echo "runnable=true"                             >> "$proj_dir/export_presets.cfg"
              echo "dedicated_server=false"                    >> "$proj_dir/export_presets.cfg"
              echo "custom_features=\"\""                      >> "$proj_dir/export_presets.cfg"
              echo "export_filter=\"all_resources\""           >> "$proj_dir/export_presets.cfg"
              echo "include_filter=\"\""                       >> "$proj_dir/export_presets.cfg"
              echo "exclude_filter=\"\""                       >> "$proj_dir/export_presets.cfg"
              echo "export_path=\"./index.html\""              >> "$proj_dir/export_presets.cfg"
              echo "patches=PackedStringArray()"               >> "$proj_dir/export_presets.cfg"
              echo ""                                           >> "$proj_dir/export_presets.cfg"
              echo "[preset.0.options]"                        >> "$proj_dir/export_presets.cfg"
              echo ""                                           >> "$proj_dir/export_presets.cfg"
              echo "variant/extensions_support=false"          >> "$proj_dir/export_presets.cfg"
              echo "variant/thread_support=false"              >> "$proj_dir/export_presets.cfg"
              echo "vram_texture_compression/for_desktop=true" >> "$proj_dir/export_presets.cfg"
              echo "vram_texture_compression/for_mobile=false" >> "$proj_dir/export_presets.cfg"
              echo "html/export_icon=true"                     >> "$proj_dir/export_presets.cfg"
              echo "html/custom_html_shell=\"\""               >> "$proj_dir/export_presets.cfg"
              echo "html/head_include=\"\""                    >> "$proj_dir/export_presets.cfg"
              echo "html/canvas_resize_policy=2"               >> "$proj_dir/export_presets.cfg"
              echo "html/focus_canvas_on_start=true"           >> "$proj_dir/export_presets.cfg"
              echo "html/experimental_virtual_keyboard=false"  >> "$proj_dir/export_presets.cfg"
              echo "progressive_web_app/enabled=false"         >> "$proj_dir/export_presets.cfg"
            else
              # تأكد من أن الاسم Web وليس HTML5
              sed -i 's/name="HTML5"/name="Web"/g' "$proj_dir/export_presets.cfg"
              sed -i 's/platform="HTML5"/platform="Web"/g' "$proj_dir/export_presets.cfg"
              echo "[OK] export_presets.cfg verified for $slug"
            fi

            # تشغيل التصدير
            echo "[INFO] Running Godot export..."
            ABS_OUTPUT="$(pwd)/$OUTPUT_DIR"
            "$GODOT_BIN" --headless --path "$(pwd)/$proj_dir" \
              --export-release "Web" "$ABS_OUTPUT/index.html" 2>&1 || true

            # التحقق من الملفات
            echo "[INFO] Checking exported files..."
            ALL_OK=true
            for f in index.html index.js index.wasm index.pck; do
              if [ -f "$OUTPUT_DIR/$f" ] && [ -s "$OUTPUT_DIR/$f" ]; then
                SIZE=$(du -h "$OUTPUT_DIR/$f" | cut -f1)
                echo "[OK] $f ($SIZE)"
              else
                echo "[FAIL] Missing or empty: $f"
                ALL_OK=false
              fi
            done

            if [ "$ALL_OK" = "false" ]; then
              echo "[FAIL] Export incomplete for: $slug"
              EXPORT_FAILED=true
            else
              echo "[OK] Export successful: $slug"
            fi
          done

          if [ "$EXPORT_FAILED" = "true" ]; then
            exit 1
          fi

      - name: Commit exported files
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/games/godot/ 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "godot: export games [skip ci]"
            git pull --rebase origin main || git rebase --abort
            git push origin main --force-with-lease
            echo "[OK] Changes pushed"
          else
            echo "[INFO] No changes to commit"
          fi
