name: Produce Episode

on:
  schedule:
    - cron: '0 18 */3 * *'   # كل 3 أيام الساعة 18:00 UTC
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'رقم الحلقة (فارغ = التالية تلقائياً)'
        required: false
        default: ''

jobs:
  produce:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        run: npm install

      # ffmpeg يُثبَّت تلقائياً عبر @ffmpeg-installer/ffmpeg
      # edge-tts يعمل عبر edge-tts-node بدون pip
      # لا حاجة لأي أداة خارجية

      - name: Produce Episode
        shell: pwsh
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN:       ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_USERNAME:           ${{ secrets.TIKTOK_USERNAME }}
          SUNO_API_KEY:              ${{ secrets.SUNO_API_KEY }}
          MODE:                      episode
          EPISODE_NUMBER:            ${{ github.event.inputs.episode_number }}
        run: node orchestrator.js

      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_number }}
          path: |
            episodes/
            series.json
            agent-results/run-report.json
          retention-days: 30

      - name: Commit series progress
        shell: pwsh
        run: |
          git config user.name  "Universe Bot"
          git config user.email "bot@universe.ai"
          git add series.json agent-results/run-report.json
          $diff = git diff --staged --quiet; if ($LASTEXITCODE -ne 0) {
            $ep = node -e "const s=require('./series.json'); process.stdout.write(String(s.nextEpisode-1))"
            git commit -m "episode: produced ep$ep"
            git push
          }
