# produce-episode.yml — v2.0
#
# التغييرات عن v1.0:
#  - timeout: 90 → 120 دقيقة
#  - git add يشمل episodes/ + agent-results/
#  - series.json guard قبل commit
#  - git stash + pull --rebase قبل push (rule-120)
#  - حذف SUNO_API_KEY (Zero Cost Policy)
#  - إضافة git stash pop بعد push
#  - فصل upload artifact عن commit
#
# القواعد المطبقة:
#  rule-099 : لا إيموجي في commit messages
#  rule-106 : GEMINI_API_KEY الاسم الموحد
#  rule-120 : git stash قبل pull --rebase
#  rule-126 : لا Zero Cost: لا SUNO حتى يبدأ الدخل
#  rule-127 : windows-latest + shell: pwsh
#  rule-130 : ترتيب خط الإنتاج إلزامي

name: Produce Episode

on:
  schedule:
    - cron: '0 3 */3 * *'   # كل 3 أيام الساعة 18:00 UTC
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'رقم الحلقة (فارغ = التالية تلقائياً)'
        required: false
        default: ''

jobs:
  produce:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # نحتاج التاريخ الكامل لـ rebase

      # ── 2. Node.js ───────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # لا cache: npm — rule-121 (package-lock.json غير مضمون)

      # ── 3. Install ───────────────────────────────────
      - name: Install dependencies
        shell: pwsh
        run: npm install
        # ffmpeg   → @ffmpeg-installer/ffmpeg (تلقائي)
        # tts      → msedge-tts (مجاني — rule-146)
        # لا pip   → rule-126
        # لا bash  → rule-127

      # ── 4. Produce Episode ───────────────────────────
      - name: Produce Episode
        shell: pwsh
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:          ${{ secrets.GEMINI_API_KEY_2 }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN:       ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_USERNAME:           ${{ secrets.TIKTOK_USERNAME }}
          MODE:                      episode
          EPISODE_NUMBER:            ${{ github.event.inputs.episode_number }}
        run: node orchestrator.js

      # ── 5. Upload Artifact (دائماً) ──────────────────
      - name: Upload episode artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_number }}
          path: |
            episodes/
            agent-results/screenplay-ep*.json
            agent-results/run-report.json
            series.json
          retention-days: 30

      # ── 6. Commit + Push ─────────────────────────────
      - name: Commit episode progress
        shell: pwsh
        run: |
          git config user.name  "Universe Bot"
          git config user.email "bot@universe.ai"

          # أضف كل الملفات المتغيرة
          git add episodes\         2>$null
          git add agent-results\    2>$null
          git add series.json       2>$null
          git add library\          2>$null

          # تحقق من وجود تغييرات
          $hasDiff = $false
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) { $hasDiff = $true }

          if (-not $hasDiff) {
            Write-Host "[INFO] No changes to commit"
            exit 0
          }

          # استخرج رقم الحلقة بأمان
          $epNum = "unknown"
          if (Test-Path "series.json") {
            try {
              $series = Get-Content "series.json" | ConvertFrom-Json
              $epNum  = [int]$series.nextEpisode - 1
            } catch {
              Write-Host "[WARN] Could not parse series.json"
            }
          }

          git commit -m "episode: produced ep$epNum [skip ci]"

          # rule-120: stash + rebase + push + pop
          git stash
          git pull --rebase origin main
          git stash pop

          # push مع retry مرة واحدة
          git push origin main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[WARN] Push failed — retrying after rebase"
            git pull --rebase origin main
            git push origin main
          }

          Write-Host "[OK] Episode ep$epNum committed and pushed"
