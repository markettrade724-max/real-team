# universe-evolution.yml — v2.0
#
# التغييرات عن v1.0:
#  - حذف cache: npm (rule-121)
#  - timeout: مرفوع لـ 120 دقيقة
#  - git stash + pull --rebase (rule-120)
#  - retry على push
#  - [skip ci] في commit message
#  - حذف SUNO_API_KEY (Zero Cost Policy)
#  - فصل artifact عن commit
#
# القواعد المطبقة:
#  rule-099 : لا إيموجي في commit messages
#  rule-106 : GEMINI_API_KEY الاسم الموحد
#  rule-120 : git stash قبل pull --rebase
#  rule-121 : لا cache: npm
#  rule-127 : windows-latest + shell: pwsh

name: Universe Evolution

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم الساعة 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - birth
          - evolution
          - invention
          - revival
          - sync
          - code
          - library

jobs:
  evolve:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Node.js ───────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # لا cache: npm — rule-121

      # ── 3. Install ───────────────────────────────────
      - name: Install dependencies
        shell: pwsh
        run: npm install

      # ── 4. Run Orchestrator ──────────────────────────
      - name: Run Orchestrator
        shell: pwsh
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:          ${{ secrets.GEMINI_API_KEY_2 }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN:       ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_USERNAME:           ${{ secrets.TIKTOK_USERNAME }}
          KOFI_VERIFICATION_TOKEN:   ${{ secrets.KOFI_VERIFICATION_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: node orchestrator.js

      # ── 5. Upload Artifact ───────────────────────────
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ github.run_number }}-${{ github.event.inputs.mode || 'auto' }}
          path: |
            agent-results/
            universe.json
            universe.backup.json
            godot-recipes/index.json
            library/budget.json
          retention-days: 14

      # ── 6. Commit + Push ─────────────────────────────
      - name: Commit universe progress
        shell: pwsh
        run: |
          git config user.name  "Universe Bot"
          git config user.email "bot@universe.ai"

          # أضف كل الملفات المتغيرة
          git add universe.json          2>$null
          git add agent-results\         2>$null
          git add godot-projects\        2>$null
          git add godot-recipes\         2>$null
          git add library\               2>$null
          git add public\products.json   2>$null
          git add products.json          2>$null

          # تحقق من وجود تغييرات
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[INFO] No changes to commit"
            exit 0
          }

          # استخرج معلومات للـ commit message
          $mode      = "${{ github.event.inputs.mode || 'auto' }}"
          $day       = (Get-Date).DayOfWeek.ToString().ToLower()
          $worlds    = "0"
          $evolutions = "0"

          if (Test-Path "universe.json") {
            try {
              $uni        = Get-Content "universe.json" | ConvertFrom-Json
              $worlds     = [string]$uni.worlds.Count
              $evolutions = [string]$uni.evolutions
            } catch {
              Write-Host "[WARN] Could not parse universe.json"
            }
          }

          git commit -m "evolution: day=$day mode=$mode worlds=$worlds ev=$evolutions [skip ci]"

          # rule-120: stash + rebase + push + pop
          git stash
          git pull --rebase origin main
          git stash pop

          git push origin main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[WARN] Push failed — retrying"
            git pull --rebase origin main
            git push origin main
          }

          Write-Host "[OK] Universe progress committed"
